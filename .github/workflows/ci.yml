name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Eval retrieval-only (FTS, no Ollama)
        run: cluny eval --retrieval-only --fts-only --output eval/reports/ci.json
        env:
          CLUNY_DATA_DIR: /tmp/cluny-ci-empty
