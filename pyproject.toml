[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluny-agent"
version = "0.1.0"
description = "Cluny — local-first second brain (Ollama + vector store)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "chromadb>=0.5.0",
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
  "pypdf>=5.0.0",
  "trafilatura>=1.9.0",
  "pymupdf>=1.24.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "watchdog>=4.0.0",
  "PySide6>=6.6.0",
  "PyYAML>=6.0.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]
rerank = [
  "sentence-transformers>=3.0.0",
]
backup = [
  "pyzipper>=0.3.6",
]
packaging = [
  "py2app>=0.28.0",
]

[project.scripts]
cluny = "cluny.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cluny"]

[tool.hatch.build.targets.sdist]
include = ["cluny"]
