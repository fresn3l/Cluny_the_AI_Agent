# Golden questions for `cluny eval`.
# expect_sources: substrings that should appear in retrieved doc paths (empty list = any hit).
# expect_refusal: true when the answer should admit missing information.
# skip_when_empty: pass in CI when index is empty (no retrieval expected).

- question: "What topics are covered in my indexed notes?"
  k: 3
  skip_when_empty: true

- question: "What did the Smith paper say about working memory?"
  expect_sources: ["smith"]
  k: 5
  skip_when_empty: true

- question: "What is the capital of Atlantis?"
  expect_refusal: true
  k: 3

- question: "Summarize journal entries about travel."
  k: 5
  skip_when_empty: true

- question: "Find notes mentioning attention limits."
  expect_sources: []
  k: 5
  skip_when_empty: true

- question: "Who wrote about cognitive load theory?"
  expect_sources: ["cognitive"]
  k: 5
  skip_when_empty: true

- question: "What meetings are mentioned in my notes?"
  k: 5
  skip_when_empty: true

- question: "Explain quantum chromodynamics in detail."
  expect_refusal: true
  k: 3

- question: "List proper nouns from research papers in the index."
  k: 5
  skip_when_empty: true

- question: "What dates appear in journal entries?"
  expect_sources: []
  k: 5
  skip_when_empty: true
